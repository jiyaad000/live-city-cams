name: AI Rain Detection

on:
  schedule:
    - cron: '*/10 * * * *'  # Runs automatically every 10 minutes
  workflow_dispatch:        # Allows manual trigger from GitHub UI

jobs:
  detect-rain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install opencv-python-headless numpy yt-dlp google-genai

      - name: Run AI Rain Check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python detect_rain.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add rain_status.json
          git commit -m "Auto-update rain status via Vision AI" || exit 0
          git push
