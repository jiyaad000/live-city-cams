<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fuvahmulah City Cams</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 { font-size: 1.8rem; margin-bottom: 6px; }
    p { color: #94a3b8; font-size: 0.95rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
    }
    .card-title {
      padding: 12px 16px;
      font-weight: 600;
      font-size: 1rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
      display: inline-block;
    }
    .wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
    }
    .wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎥 Fuvahmulah City Council Live Feeds</h1>
    <p>Secretariat of the Fuvahmulah City Council Public Monitoring Streams</p>
  </header>

  <div class="grid">
    
    <!-- Cam 1: Genmiskih Fannu -->
    <div class="card">
      <div class="card-title"><span class="live-dot"></span> Genmiskih Fannu Live</div>
      <div class="wrap">
        <iframe
          src="https://www.youtube-nocookie.com/embed/HMmVUTWDN3s?autoplay=1&mute=1&controls=1&enablejsapi=1"
          title="Genmiskih Fannu Live"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
      </div>
    </div>

    <!-- Cam 2: Genmiskih Magu -->
    <div class="card">
      <div class="card-title"><span class="live-dot"></span> Genmiskih Magu Live</div>
      <div class="wrap">
        <iframe
          src="https://www.youtube-nocookie.com/embed/dJ3lcom_xk8?autoplay=1&mute=1&controls=1&enablejsapi=1"
          title="Genmiskih Magu Live"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
      </div>
    </div>

    <!-- Cam 3: Fish Market -->
    <div class="card">
      <div class="card-title"><span class="live-dot"></span> Fuvahmulah Fish Market Live</div>
      <div class="wrap">
        <iframe
          src="https://www.youtube-nocookie.com/embed/GW5qgbT80oA?autoplay=1&mute=1&controls=1&enablejsapi=1"
          title="Fuvahmulah Fish Market Live"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
      </div>
    </div>

  </div>

  <script>
    // Automatically injects your GitHub Pages domain origin to satisfy YouTube Error 153 checks
    document.querySelectorAll('iframe').forEach(iframe => {
      const currentSrc = iframe.getAttribute('src');
      const origin = window.location.origin;
      if (origin && origin !== 'null' && !origin.startsWith('file://')) {
        iframe.setAttribute('src', currentSrc + '&origin=' + encodeURIComponent(origin) + '&widget_referrer=' + encodeURIComponent(origin));
      }
    });
  </script>

</body>
</html>
